[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "py-sparkx-omicverse"
version = "0.1.0"
readme = "README.md"
description = "Reference-validated py-SPARKX algorithm subset"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23", "scipy>=1.10", "pandas>=1.5"]
[project.urls]
Repository = "https://github.com/omicverse/py-SPARKX"
Issues = "https://github.com/omicverse/py-SPARKX/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
[tool.setuptools.packages.find]
include = ["pysparkx*"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
license-files = ["LICENSE", "ATTRIBUTION.md"]
